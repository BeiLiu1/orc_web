services:
  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: invoice-ocr-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
    volumes:
      - ./storage:/app/storage
    networks:
      - invoice-ocr

  frontend:
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    container_name: invoice-ocr-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - invoice-ocr

networks:
  invoice-ocr:
    driver: bridge
